name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        django-version: ["4.2", "5.2"]
        include:
          # Django 6.x requires Python 3.12+.
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "Django~=${{ matrix.django-version }}.0"

      - name: Show versions
        run: python -c "import django, babel, sys; print(sys.version); print('Django', django.get_version()); print('Babel', babel.__version__)"

      - name: Run tests
        run: python -m pytest -ra

      - name: Run tests without Babel
        run: |
          python -m pip uninstall -y Babel
          python -m pytest -ra

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .

  build:
    name: build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The wheel must carry the templates, static files and translations
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "django_rtl_admin/templates/admin/base_site.html",
              "django_rtl_admin/templates/django_rtl_admin/base_site.html",
              "django_rtl_admin/templates/django_rtl_admin/language_switcher.html",
              "django_rtl_admin/static/django_rtl_admin/css/rtl-admin.css",
              "django_rtl_admin/static/django_rtl_admin/js/language_switcher.js",
              "django_rtl_admin/locale/ar/LC_MESSAGES/django.mo",
          }
          missing = sorted(required - names)
          assert not missing, f"missing from {wheel.name}: {missing}"
          print(f"{wheel.name} ok ({len(names)} files)")
          PY
